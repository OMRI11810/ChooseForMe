# Railway configuration as code (https://docs.railway.app/guides/config-as-code).
# Set the service's Root Directory to "backend" so Nixpacks installs
# backend/requirements.txt and this file is picked up.

[build]
builder = "NIXPACKS"

[deploy]
# Apply schema migrations, then serve. Railway injects PORT; --proxy-headers
# keeps URLs/scheme correct behind Railway's edge proxy.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10